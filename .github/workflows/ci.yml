name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.plan.outputs.base }}
      full: ${{ steps.plan.outputs.full }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      browser: ${{ steps.plan.outputs.browser }}
      lighthouse: ${{ steps.plan.outputs.lighthouse }}
      container_web: ${{ steps.plan.outputs.container_web }}
      container_api: ${{ steps.plan.outputs.container_api }}
      database: ${{ steps.plan.outputs.database }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Select affected checks
        id: plan
        run: pnpm ci:change-plan

  quality:
    name: Quality
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Nx task cache
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-quality-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-quality-
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate source artifacts
        run: pnpm generate

      - name: Audit changed code with Fallow
        id: fallow
        if: github.event_name == 'pull_request'
        env:
          FALLOW_AUDIT_BASE: ${{ needs.changes.outputs.base }}
        run: pnpm fallow:ci:generated

      - name: Audit complete codebase with Fallow
        if: github.event_name != 'pull_request'
        run: pnpm fallow:full:generated

      - name: Upload Fallow SARIF report
        if: always() && steps.fallow.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: fallow-sarif-${{ github.run_id }}
          path: .fallowci/fallow.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Audit dependencies
        if: ${{ !cancelled() && needs.changes.outputs.dependencies == 'true' }}
        run: pnpm run audit

      - name: Verify complete repository
        if: ${{ !cancelled() && needs.changes.outputs.full == 'true' }}
        run: pnpm check:quality:generated

      - name: Verify affected changes
        if: ${{ !cancelled() && needs.changes.outputs.full != 'true' }}
        env:
          VERIFY_BASE: ${{ needs.changes.outputs.base }}
          VERIFY_MODE: quality
          VERIFY_SKIP_FALLOW: "true"
        run: pnpm verify:changed

  site-build:
    name: Site build
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Nx task cache
        uses: actions/cache@v5
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-site-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-site-
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**', 'tsconfig.base.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build:site

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.run_id }}
          path: dist/site
          include-hidden-files: true
          retention-days: 1

  browser:
    name: Browser quality
    needs: [changes, site-build]
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site-${{ github.run_id }}
          path: dist/site

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: End-to-end test
        run: pnpm test:e2e:ci

      - name: Lighthouse audit
        if: needs.changes.outputs.lighthouse == 'true'
        env:
          LIGHTHOUSE_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
        run: pnpm test:lighthouse:ci

  container-web:
    name: Production web container
    needs: changes
    if: needs.changes.outputs.container_web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production web container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: swearing-map:local
          cache-from: type=gha,scope=web-container
          cache-to: type=gha,mode=max,scope=web-container

      - name: Smoke-test production web container
        run: pnpm container:smoke

  container-api:
    name: Production API container
    needs: changes
    if: needs.changes.outputs.container_api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production API container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          load: true
          tags: swearing-map-api:local
          cache-from: type=gha,scope=api-container
          cache-to: type=gha,mode=max,scope=api-container

      - name: Smoke-test production API container
        run: pnpm container:api:smoke

  database:
    name: Database integration
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations, seed, verify drift, and test PostgreSQL
        run: pnpm test:database
